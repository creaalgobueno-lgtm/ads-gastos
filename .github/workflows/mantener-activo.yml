# Mantiene despierto el proyecto de Supabase (plan gratuito: se pausa
# tras 7 dias sin actividad y la app movil y las licencias dejan de funcionar).
name: Mantener activo el servidor

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la funcion gastos
        run: |
          curl -sS -m 30 -X POST https://tuhikfycnececxxzewwv.supabase.co/functions/v1/gastos -H "Content-Type: application/json" -d '{"action":"hello","token":"keepalive"}' | tee r.txt
          grep -q "unknown-token" r.txt
